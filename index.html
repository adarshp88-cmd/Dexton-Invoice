<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dexton Invoice Maker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#faf8f4;--card:#fff;--tx:#1d1d1b;--mu:#6b6860;--ac:#c2410c;--bd:#e4dfd5;--in:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161512;--card:#211f1b;--tx:#f2efe8;--mu:#a09b90;--ac:#fb923c;--bd:#38342d;--in:#2a2722}}
:root[data-theme="dark"]{--bg:#161512;--card:#211f1b;--tx:#f2efe8;--mu:#a09b90;--ac:#fb923c;--bd:#38342d;--in:#2a2722}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px;max-width:560px;margin:0 auto}
h1{font-size:20px;margin:4px 0 2px}
.sub{color:var(--mu);font-size:13px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:9px;background:var(--in);color:var(--tx);font:inherit}
.row{display:grid;grid-template-columns:1fr 90px 90px;gap:8px;align-items:end}
.row .n{padding:10px 0;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tot{display:flex;justify-content:space-between;padding:3px 0;font-size:14px}
.tot.g{font-weight:700;font-size:18px;border-top:1px solid var(--bd);margin-top:6px;padding-top:8px}
button{width:100%;padding:14px;border:0;border-radius:11px;background:var(--ac);color:#fff;font:600 16px inherit;cursor:pointer}
button.s{background:transparent;color:var(--ac);border:1px solid var(--bd);margin-bottom:12px}
details summary{cursor:pointer;font-weight:600}
.lnk{display:block;text-align:center;text-decoration:none;padding:13px;border-radius:11px;background:#1fa855;color:#fff;font-weight:600;margin-top:8px}
.lnk.alt{background:#0f4b82}
#msg{font-size:13px;color:var(--mu);text-align:center;margin-top:8px;min-height:18px}
</style>
</head>
<body>
<h1>Dexton Global – Invoice Maker</h1>
<div class="sub">Enter vendor + quantities → download PDF invoice.</div>

<div class="card">
  <label>Vendor name</label>
  <input id="vn" list="vl" placeholder="e.g. Sharma Traders" autocomplete="off">
  <datalist id="vl"></datalist>
  <label>Vendor address / GSTIN (optional)</label>
  <textarea id="va" rows="2" placeholder="Address, GSTIN"></textarea>
  <div class="two">
    <div><label>WhatsApp no. (optional)</label><input id="vw" type="tel" inputmode="tel" placeholder="98xxxxxx10"></div>
    <div><label>Email (optional)</label><input id="ve" type="email" placeholder="vendor@mail.com"></div>
  </div>
  <div class="two">
    <div><label>Invoice no.</label><input id="no"></div>
    <div><label>Date</label><input id="dt" type="date"></div>
  </div>
</div>

<div class="card">
  <div class="row" style="margin-bottom:-4px"><label>Flavour</label><label>Qty</label><label>Rate (₹)</label></div>
  <div id="items"></div>
  <label>Tax type</label>
  <select id="tx">
    <option value="intra">Same state (CGST + SGST)</option>
    <option value="inter">Other state (IGST)</option>
    <option value="none">No GST</option>
  </select>
  <div style="margin-top:12px">
    <div class="tot"><span>Subtotal</span><span id="st">0.00</span></div>
    <div class="tot"><span>GST</span><span id="gt">0.00</span></div>
    <div class="tot g"><span>Total</span><span id="tt">₹0.00</span></div>
  </div>
</div>

<button id="go">Generate PDF invoice</button>
<div id="msg"></div>
<div id="sh" class="card" style="display:none;margin-top:12px">
  <div style="font-size:13px;color:var(--mu);margin-bottom:8px">Invoice saved. Send it to the vendor, then attach the PDF you just saved.</div>
  <a id="wa" class="lnk" target="_blank" rel="noopener" style="display:none">Open WhatsApp chat</a>
  <a id="em" class="lnk alt" target="_blank" rel="noopener" style="display:none">Open email</a>
</div>

<details class="card" style="margin-top:14px">
  <summary>Business settings</summary>
  <label>Company name</label><input id="cn">
  <label>Address</label><textarea id="ca" rows="2" placeholder="Your registered address"></textarea>
  <div class="two">
    <div><label>GSTIN</label><input id="cg"></div>
    <div><label>Phone / email</label><input id="cp"></div>
  </div>
  <div class="two">
    <div><label>HSN code</label><input id="hs"></div>
    <div><label>GST %</label><input id="gp" type="number" step="0.5"></div>
  </div>
  <label>Bank details (shown on invoice)</label><textarea id="bk" rows="3" placeholder="Bank, A/C no., IFSC"></textarea>
  <label>Terms</label><input id="tm">
</details>

 rates:[0,0,0,0],lastNo:0,vendors:{}};

const $=i=>document.getElementById(i);
function save(){try{localStorage.setItem("dexton_inv",JSON.stringify(S))}catch(e){}}
const f2=n=>n.toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});

// build item rows
FL.forEach((n,i)=>{
  const d=document.createElement("div");d.className="row";
  d.innerHTML=`<div class="n">Flavoured Murmura – ${n}</div><input type="number" inputmode="numeric" min="0" id="q${i}" placeholder="0"><input type="number" inputmode="decimal" min="0" id="r${i}">`;
  $("items").appendChild(d);
});
["cn","ca","cg","cp","hs","gp","bk","tm"].forEach(k=>{$(k).value=S[k]});
FL.forEach((_,i)=>{$("r"+i).value=S.rates[i]||""});
$("no").value=S.lastNo+1;
$("dt").value=new Date().toISOString().slice(0,10);
function fillVendors(){$("vl").innerHTML=Object.keys(S.vendors).map(v=>`<option value="${v.replace(/"/g,"&quot;")}">`).join("")}
fillVendors();
$("vn").addEventListener("change",()=>{let v=S.vendors[$("vn").value];if(v===undefined)return;if(typeof v==="string")v={a:v};$("va").value=v.a||"";$("vw").value=v.w||"";$("ve").value=v.e||""});

function calc(){
  const lines=FL.map((n,i)=>({n,q:+$("q"+i).value||0,r:+$("r"+i).value||0})).filter(l=>l.q>0);
  lines.forEach(l=>l.a=l.q*l.r);
  const sub=lines.reduce((s,l)=>s+l.a,0);
  const gp=$("tx").value==="none"?0:(+$("gp").value||0);
  const gst=sub*gp/100;
  return{lines,sub,gp,gst,tot:sub+gst};
}
function upd(){const c=calc();$("st").textContent=f2(c.sub);$("gt").textContent=f2(c.gst);$("tt").textContent="₹"+f2(c.tot)}
document.querySelectorAll("input,select,textarea").forEach(e=>e.addEventListener("input",()=>{
  S.cn=$("cn").value;S.ca=$("ca").value;S.cg=$("cg").value;S.cp=$("cp").value;S.hs=$("hs").value;
  S.gp=$("gp").value;S.bk=$("bk").value;S.tm=$("tm").value;S.rates=FL.map((_,i)=>+$("r"+i).value||0);
  save();upd();
}));
upd();

  }catch(e){m.textContent=e&&e.code==="declined"?"Download cancelled.":"Couldn't save the PDF here."}
